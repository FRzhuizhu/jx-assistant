<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>远程接入</title>
<script src="/peerjs.min.js" defer></script>

  }

    background: #fff; border: 1px solid #e2e4e9; border-radius: 6px;
    padding: 32px 28px;
  }
  h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #8a909c; margin-bottom: 22px; line-height: 1.5; }
  input {
    width: 100%; padding: 9px 10px; margin-bottom: 10px;
    background: #fff; border: 1px solid #d4d7de; border-radius: 4px;
    color: #1f2329; font-size: 14px; outline: none;
  }
  input:focus { border-color: #356ae6; }
  button {
    width: 100%; padding: 9px; margin-top: 4px; border: none; border-radius: 4px;
    background: #356ae6; color: #fff; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #2c5bd0; }
  button:active { opacity: .9; }
  .status { margin-top: 16px; font-size: 12px; color: #8a909c; line-height: 1.6; min-height: 18px; }
  .status.err { color: #d43c3c; }
  .spin {
    display: inline-block; width: 12px; height: 12px; vertical-align: -2px;
    border: 2px solid #d4d7de; border-top-color: #356ae6; border-radius: 50%;
    animation: sp .8s linear infinite; margin-right: 6px;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  .progress { margin-top: 14px; height: 2px; background: #eceef2; overflow: hidden; display: none; }
  .progress.on { display: block; }
  .progress i { display: block; height: 100%; width: 35%; background: #356ae6; animation: pg 1.2s ease-in-out infinite; }
  @keyframes pg { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
<div class="panel">
  <h1>远程接入</h1>
  <div class="sub">输入目标设备的设备码与配对密钥<br>连接后自动加载对方提供的页面</div>
  <input id="peerId" placeholder="设备码" autocomplete="off" autocapitalize="off">
  <input id="pairKey" placeholder="配对密钥" autocomplete="off">
  <button id="goBtn">连接</button>
  <div class="progress" id="prog"><i></i></div>
  <div class="status" id="status"></div>
</div>
<script>
/* =========================================================
 * 通用远程接入配对页（210 网关）：
 *   1. 收集配对信息（URL #peer=..&pk=..[..&relay=1] 或手动输入，存 localStorage）
 *   2. 建立 P2P 直连（PeerJS 信令）或加密中继（POST /relay）通道
 *   3. 经通道从目标设备拉取应用外壳（GET /api/p2p-shell）并整页替换
 * 本页不含任何业务逻辑；应用前端永远从目标设备实时获取，中继不寄存副本。
 * 帧协议与加密格式必须与目标侧 p2p.js 保持一致：
 *   DataChannel JSON 帧 auth/req/head/chunk/end/err；
 *   中继封包 AES-256-GCM(key=SHA-256(pairKey))，{iv,ct} base64，ct 尾 16B 为 tag。
 * ========================================================= */

   因此不得向全局泄漏任何标识符（window 属性不受影响） */

const SHELL_CACHE_KEY = 'p2p_shell_cache_v3' + (APP_ID ? '_' + APP_ID : ''); // 外壳离线兜底缓存：仅家端不可达时使用（connect 末段），正常打开每次都拉最新、无 TTL 捷径
// 清理旧版本缓存：v1 无版本号 key（2.5MB 中继探测缺陷）；v2 外壳无会话级参数逻辑
try {
  localStorage.removeItem('p2p_shell_cache' + (APP_ID ? '_' + APP_ID : ''));
  localStorage.removeItem('p2p_shell_cache_v2' + (APP_ID ? '_' + APP_ID : ''));
} catch {}
const $ = (id) => document.getElementById(id);
const HAS_SUBTLE = typeof crypto !== 'undefined' && !!crypto.subtle;

function setStatus(msg, isErr) {
  // 换页后旧 DOM 已被清空：$() 可能返回 null，必须空值保护，
  // 否则这里抛出的未捕获异常会中断 document.write 流里尚未执行的内联脚本（应用主脚本）
  const el = $('status');
  if (!el) return;
  el.className = 'status' + (isErr ? ' err' : '');
  el.innerHTML = (msg && !isErr ? '<span class="spin"></span>' : '') + (msg || '');
  const prog = $('prog');
  if (prog) prog.className = 'progress' + (msg && !isErr ? ' on' : '');
}

/* ---------- base64 工具 ---------- */

  0x04,0xc7,0x23,0xc3,0x18,0x96,0x05,0x9a,0x07,0x12,0x80,0xe2,0xeb,0x27,0xb2,0x75,
  0x09,0x83,0x2c,0x1a,0x1b,0x6e,0x5a,0xa0,0x52,0x3b,0xd6,0xb3,0x29,0xe3,0x2f,0x84,
  0x53,0xd1,0x00,0xed,0x20,0xfc,0xb1,0x5b,0x6a,0xcb,0xbe,0x39,0x4a,0x4c,0x58,0xcf,
  0xd0,0xef,0xaa,0xfb,0x43,0x4d,0x33,0x85,0x45,0xf9,0x02,0x7f,0x50,0x3c,0x9f,0xa8,
  0x51,0xa3,0x40,0x8f,0x92,0x9d,0x38,0xf5,0xbc,0xb6,0xda,0x21,0x10,0xff,0xf3,0xd2,
  0xcd,0x0c,0x13,0xec,0x5f,0x97,0x44,0x17,0xc4,0xa7,0x7e,0x3d,0x64,0x5d,0x19,0x73,

  0xe0,0x32,0x3a,0x0a,0x49,0x06,0x24,0x5c,0xc2,0xd3,0xac,0x62,0x91,0x95,0xe4,0x79,
  0xe7,0xc8,0x37,0x6d,0x8d,0xd5,0x4e,0xa9,0x6c,0x56,0xf4,0xea,0x65,0x7a,0xae,0x08,
  0xba,0x78,0x25,0x2e,0x1c,0xa6,0xb4,0xc6,0xe8,0xdd,0x74,0x1f,0x4b,0xbd,0x8b,0x8a,
  0x70,0x3e,0xb5,0x66,0x48,0x03,0xf6,0x0e,0x61,0x35,0x57,0xb9,0x86,0xc1,0x1d,0x9e,

/* ---------- 中继封包（与目标侧 sealFrame/openPack 格式一致） ---------- */
let cfg = null; // {peerId, pairKey}
let handoffConn = null; // 直连 DataConnection：仅本页拉外壳期间持有（换页即随文档销毁，应用不再复用）
let _relayKeyObj = null, _relayKeyFor = '';
async function relayKeyObj() {
  if (!HAS_SUBTLE) return null;
  if (_relayKeyObj && _relayKeyFor === cfg.pairKey) return _relayKeyObj;
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(cfg.pairKey));
  _relayKeyObj = await crypto.subtle.importKey('raw', digest, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  _relayKeyFor = cfg.pairKey;

    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, await relayKeyObj(), ct);

/* ---------- 通道 A：P2P 直连（PeerJS DataChannel 帧协议；仅中继失败时兜底） ---------- */
async function waitPeer(ms) { // peerjs 为 defer 加载：兜底直连时可能尚未就绪，最多等 ms
  const t0 = Date.now();
  while (typeof Peer === 'undefined') {
    if (Date.now() - t0 > ms) return false;
    await new Promise(r => setTimeout(r, 100));
  }
  return true;
}
async function directFetchShell() {
  if (!(await waitPeer(3000))) throw new Error('peerjs 未加载');
  return await new Promise((resolve, reject) => {
    const peer = new Peer({
      host: location.hostname,
      port: Number(location.port) || 80,
      path: '/peerjs',
      key: 'chat_p2p_v1',
      secure: location.protocol === 'https:',
      config: { iceServers: [{ urls: ['stun:stun.miwifi.com:3478', 'stun:stun.qq.com:3478'] }] },
    });
    let settled = false;
    const fail = (msg) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      try { peer.destroy(); } catch {}
      reject(new Error(msg));
    };
    const timer = setTimeout(() => fail('直连超时（4s，不通即转中继）'), 4000);
    peer.on('error', (e) => {
      if (e.type === 'peer-unavailable') fail('目标设备不在线');
      else if (e.type === 'browser-incompatible') fail('当前浏览器不支持 WebRTC');
      else fail('P2P 错误 ' + e.type);
    });
    peer.on('open', () => {
      setStatus('信令已连 · 打洞中…');
      // 默认 binary 序列化（带大消息分片；'json' 模式不分片，47KB 外壳帧会被 DataChannel 截断）。
      // 本页连接仅顶层自用（拉外壳），换页即销毁；应用持续流量走中继（fetch 劫持）
      const conn = peer.connect(cfg.peerId, { reliable: true });
      handoffConn = conn; // 拉外壳期间持有（换页销毁）
      const onFrame = (f) => {
        if (!f || typeof f !== 'object') return;
        if (f.t === 'head') head = f;
        else if (f.t === 'chunk') chunks.push(b64ToBytes(f.data));
        else if (f.t === 'end') {
          settled = true; clearTimeout(timer);
          resolve({ status: head.status || 0, contentType: head.contentType || '', chunks });
        } else if (f.t === 'err') {
          settled = true; clearTimeout(timer);
          reject(new Error(f.msg || '远程错误'));
        }
      };
      let head = null; const chunks = [];
      conn.on('open', () => conn.send({ t: 'auth', pairKey: cfg.pairKey }));
      conn.on('data', (f) => {
        if (!settled && f && f.t === 'authok') {
          setStatus('已连接 · 正在从设备获取页面…');
          conn.send({ t: 'req', id: 'shell1', method: 'GET', path: shellPath(), headers: {} });
          return;
        }
        if (!settled && f && f.t === 'authfail') return fail('配对密钥错误');
        onFrame(f);
      });
      conn.on('close', () => { if (!settled) fail('连接被关闭'); });
    });
  });
}

/* ---------- 通道 B：加密中继（POST /relay，NDJSON 逐帧解密） ---------- */
async function relayFetchShell() {
  setStatus('尝试加密中继…');
  const frame = { t: 'req', id: 'shell1', method: 'GET', path: shellPath(), headers: {} };
  const pack = await seal({ pk: cfg.pairKey, ts: Math.floor(Date.now() / 1000), frame });
  const resp = await fetch('/relay', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Relay-Peer': cfg.peerId },
    body: JSON.stringify(pack),
  });
  if (!resp.ok) {
    let msg = '中继错误 HTTP ' + resp.status;
    try { msg = (await resp.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', head = null; const chunks = []; let ended = false;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line) continue;
      let f;
      try { f = await open(JSON.parse(line).iv, JSON.parse(line).ct); } catch { continue; }
      if (f.t === 'head') head = f;
      else if (f.t === 'chunk') chunks.push(b64ToBytes(f.data));
      else if (f.t === 'end') { ended = true; break; }
      else if (f.t === 'err') throw new Error(f.msg || '远程错误');
    }
    if (ended) break;
  }
  if (!ended) throw new Error('中继无响应：配对密钥错误或目标异常');
  return { status: head.status || 0, contentType: head.contentType || '', chunks };
}

/* ---------- 拉到外壳后整页替换（注入 P2P_GATE 让应用进入远程模式） ---------- */
// 外壳 gzip 压缩传输（150KB→约35KB，中继链路带宽大头）：浏览器支持 DecompressionStream 才启用
function shellPath() {
  return (typeof DecompressionStream === 'function') ? '/api/p2p-shell?enc=gzip' : '/api/p2p-shell';
}
// gunzip 用 stream reader 实现：new Response(stream) 在部分环境（about:blank 源等）抛 Failed to fetch
async function gunzipText(u8) {
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  const reader = stream.getReader();
  const parts = [];
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value);
  }
  let len = 0;
  parts.forEach(c => len += c.length);
  const out = new Uint8Array(len);
  let off = 0;
  parts.forEach(c => { out.set(c, off); off += c.length; });
  return new TextDecoder().decode(out);
}
async function decompressIfGzip(contentType, chunks) {
  let len = 0;
  chunks.forEach(c => len += c.length);
  const body = new Uint8Array(len);
  let off = 0;
  chunks.forEach(c => { body.set(c, off); off += c.length; });
  if (!/gzip/i.test(contentType || '')) return new TextDecoder().decode(body);
  if (typeof DecompressionStream !== 'function') throw new Error('浏览器不支持 gzip 解压');
  return await gunzipText(body);
}
async function swapToShell(chunks, contentType, via) {
  let html;
  try { html = await decompressIfGzip(contentType, chunks); }
  catch (e) { setStatus('页面解压失败：' + e.message, true); return; }
  // 存入外壳缓存：仅作家端不可达时的离线兜底（connect 末段）；正常打开每次都拉最新外壳，不再用缓存秒开
  try { localStorage.setItem(SHELL_CACHE_KEY, JSON.stringify({ html, ts: Date.now() })); } catch {}
  swapInHtml(html, via, false);
}
// 立即换页（html 为未注入的原始外壳）：顶层整页替换——document.open/write 把配对页
// 本身换成应用，应用成为唯一顶层文档（2026-10 起弃用 iframe 嵌套：嵌套文档里 pushState
// 条目在退栈遍历会被引擎按条目 URL 重载 iframe，把应用整个换成配对页——手机端设置
// 二级页按返回直接「回中继页」的根源，已实测；顶层文档无此怪癖，原生历史栈可用）。
// 解析期间调用时会"拼接"而非"重置"文档（双份样式叠影 + 配对页脚本残留重入 → 无限重载），
// 兜底等 DOMContentLoaded 后再 open；顶层换页后旧文档连同 JS 上下文整体退场。
// cached=true 时剥离应用的「连接前隐藏界面」脚本
let swapped = false;
function swapInHtml(html, via, cached) {
  void via; // 通道只影响首屏拉取（直连快试/中继保底）；换页后应用经 remote-boot 的
            // fetch 劫持直连 /relay，不依赖配对页存活，也无上下文需要交接
  const doSwap = () => {
    if (swapped) return;
    swapped = true;
    let h = html.replace('<head>', '<head><scr' + 'ipt>window.P2P_GATE=true;window.P2P_APP_ID=' + JSON.stringify(APP_ID || '') + ';</scr' + 'ipt>');
    // 缓存启动不藏界面：应用的该脚本块带前置注释且跨行，正则需容忍（[^<]* 吃掉注释与换行）
    if (cached) h = h.replace(/<script>[^<]*if \(window\.P2P_GATE[\s\S]*?<\/script>\s*/, '');
    try { document.open(); document.write(h); document.close(); }
    catch (e) { swapped = false; setStatus('换页失败：' + e.message, true); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', doSwap);
  else doSwap();
}

async function connect() {
  cfg = { peerId: $('peerId').value.trim(), pairKey: $('pairKey').value.trim() };
  if (!cfg.peerId || !cfg.pairKey) { setStatus('请填写设备码和配对密钥', true); return; }
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch {}
  setStatus('连接信令服务器…');
  let r = null;
  let via = ''; // 成功通道：direct / relay（只影响首屏与状态文案；换页后持续流量统一走中继）
  const errs = [];
  // 直连优先快试（4s，不通即弃）→ 中继保底（中继成功后不再回头试直连——打不通的
  // 网络环境短期内不会再打通，白等徒增首开延迟）；两条路拉到外壳都顶层整页换掉本页
  try {
    if (window._forceRelay) throw new Error('强制中继');
    r = await directFetchShell();
    via = 'direct';
  } catch (e1) {
    errs.push('直连：' + e1.message);
    setStatus('直连未通，转加密中继…');
    try { r = await relayFetchShell(); via = 'relay'; }
    catch (e2) { errs.push('中继：' + e2.message); }
  }
  if (!r) {
    // 双通道都失败的最后兜底：缓存虽已过期但还在 → 用它换页（应用内自行直连/中继重连），
    // 避免网络抖动时死停在配对页；应用连上后会静默刷新缓存
    let stale = null;
    try {
      const c = JSON.parse(localStorage.getItem(SHELL_CACHE_KEY) || 'null');
      if (c && c.html) stale = c;
    } catch {}
    if (stale) { setStatus('连接不稳定，用缓存页面打开（应用内自动重连）…'); swapInHtml(stale.html, '', true); return; }
    setStatus(errs.join('；'), true); return;
  }
  if (r.status !== 200) { setStatus('获取页面失败：HTTP ' + r.status, true); return; }
  swapToShell(r.chunks, r.contentType, via);
}

/* 入口：URL #peer=..&pk=.. 自动填入并直连；否则展示配对表单（回填上次配置） */
(function init() {
  // 入口解析：/a/<设备号>#pk=xxx（新格式，设备号在路径）或 #peer=xxx&pk=yyy（旧格式兼容）；
  // 密钥只在 fragment 出现这一次，存档后立即从地址栏抹掉
  let hashCfg = null;
  if (location.hash.length > 1) {
    const h = new URLSearchParams(location.hash.slice(1));
    const peer = h.get('peer') || APP_ID;
    const pk = h.get('pk');
    if (peer && pk) hashCfg = { peerId: peer, pairKey: pk };
    if (h.get('relay') === '1') window._forceRelay = true;
    history.replaceState(null, '', location.pathname + location.search);
  }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch {}
  const auto = hashCfg || (saved && saved.peerId && saved.pairKey ? saved : null);
  // 无缓存捷径：每次打开都走连接拉最新外壳——家端前端更新即时可达（远程与本地一致）。
  // 外壳缓存仅剩 connect 双通道都失败时的离线兜底，不再有 12 小时 TTL 的更新盲区
  if (auto) {
    $('peerId').value = auto.peerId;
    $('pairKey').value = auto.pairKey;
    connect(); // 有配对信息自动连接（等同自动登录），失败可改输入重试
  }
  if (APP_ID && !$('peerId').value) $('peerId').value = APP_ID; // 子路径入口：设备码已知，只填密钥
  $('goBtn').onclick = connect;
  $('pairKey').addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
})();
})();
</script>
