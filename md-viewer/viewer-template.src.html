<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
:root{
    --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --border:#d0d7de;
    --accent:#0969da; --code-bg:#f6f8fa; --pre-bg:#f6f8fa;
    --toc-bg:#f6f8fa; --toc-w:240px; --header-h:52px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg);line-height:1.6;overflow:hidden}
  header{height:var(--header-h);padding:0 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:nowrap;background:var(--bg);z-index:5}
  header h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
  .meta{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap;flex:0 0 auto}
  .tools{display:flex;gap:8px;flex:0 0 auto}
  .btn{cursor:pointer;border:1px solid var(--border);background:#f6f8fa;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--fg);white-space:nowrap}
  .btn:hover{background:#eef1f4}
  .btn.on{border-color:var(--accent);color:var(--accent);background:#f0f6ff}

  #wrap{display:flex;height:calc(100% - var(--header-h))}
  #toc{width:var(--toc-w);flex:0 0 auto;background:var(--toc-bg);border-right:1px solid var(--border);overflow:auto;padding:10px 0 30px;scrollbar-width:thin}
  #toc .toc-title{font-size:12px;color:var(--muted);padding:4px 16px 8px;font-weight:600;letter-spacing:.05em}
  #toc .ti{display:block;padding:4px 12px 4px calc(12px + var(--ind,0)*16px);font-size:13px;color:#3d444d;cursor:pointer;border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
  #toc .ti:hover{background:#e9edf1}
  #toc .ti.cur{color:var(--accent);border-left-color:var(--accent);background:#e7f0fc;font-weight:600}
  #split{width:5px;flex:0 0 auto;cursor:col-resize;background:transparent}
  #split:hover,#split.drag{background:var(--accent);opacity:.35}
  body.toc-off #toc,body.toc-off #split{display:none}

  main{flex:1 1 auto;overflow:auto;padding:0 24px 60px}
  #content{max-width:900px;margin:0 auto}
  .md h1,.md h2,.md h3,.md h4{border-bottom:1px solid var(--border);padding-bottom:.3em;margin-top:1.4em}
  .md h1{font-size:1.8em}.md h2{font-size:1.45em}.md h3{font-size:1.2em}
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{scroll-margin-top:16px}
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6:target{outline:none}
  .md code{background:var(--code-bg);padding:.2em .4em;border-radius:4px;font-size:85%;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .md pre{background:var(--pre-bg);padding:14px;border-radius:8px;overflow:auto}
  .md pre code{background:none;padding:0;font-size:90%}
  .md blockquote{border-left:4px solid var(--border);margin:0;padding:0 1em;color:var(--muted)}
  .md table{border-collapse:collapse;width:100%}
  .md th,.md td{border:1px solid var(--border);padding:6px 12px}
  .md th{background:var(--code-bg)}
  .md img{max-width:100%;height:auto}
  /* 宽表格自己横向滚：右栏/手机窄栏里不把整页撑出横向滚动条（渲染后由脚本套一层） */
  .md-tablewrap{overflow-x:auto;max-width:100%}
  .md-tablewrap table{width:auto;min-width:100%}
  .md a{color:var(--accent);text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md hr{border:none;border-top:1px solid var(--border);margin:2em 0}
  .empty{color:var(--muted);text-align:center;padding:40px}

  @keyframes mdv-flash{0%{background:#fff3c2}100%{background:transparent}}
  .md .flash{animation:mdv-flash 1.2s ease-out 1}

  /* settings popover */
  #settings{position:fixed;top:calc(var(--header-h) + 6px);right:16px;width:320px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(31,35,40,.16);padding:16px 18px;z-index:50;display:none}
  #settings.open{display:block}
  #settings h3{margin:0 0 4px;font-size:14px}
  #settings .desc{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 12px}
  #settings label.row{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13.5px}
  #settings input[type=checkbox]{margin-top:3px;accent-color:var(--accent)}
  #settings .ok-line{margin-top:12px;text-align:right}
  @media (max-width:880px){
    #toc,#split{display:none !important}
    #btn-toc{display:none !important} /* 目录侧栏在窄栏里本就隐藏，按钮别占位 */
  }
  /* 窄栏（手机右栏抽屉 / 挤窄的窗口）：字号与行距按小屏重排，代码块与表格
     各自横向滚，图片按可用宽自适应——要求「铺满可用宽度且读得下去」 */
  @media (max-width:500px){
    header{padding:0 12px;gap:8px}
    header h1{font-size:14px}
    .meta{display:none} /* 副标题是路径+大小，窄屏让位给标题 */
    main{padding:0 12px 40px}
    #content{max-width:100%}
    .md{font-size:15px;line-height:1.75}
    .md h1{font-size:1.5em}.md h2{font-size:1.28em}.md h3{font-size:1.12em}
    .md h1,.md h2,.md h3,.md h4{margin-top:1.2em}
    .md pre{padding:10px;border-radius:6px}
    .md th,.md td{padding:5px 8px}
    /* 窄屏表格按内容自然宽（不压缩列、不折断单元格），宽表格由外层横向滚动 */
    .md-tablewrap table{width:max-content;min-width:0}
  }
</style>
</head>
<body>
<header>
  <h1 id="doc-title">__TITLE__</h1>
  <span class="meta" id="meta"></span>
  <span class="tools">
    <button class="btn" id="btn-toc" type="button" title="显示 / 隐藏目录（侧栏宽度可拖动调整）">目录</button>
    <button class="btn" id="btn-settings" type="button" style="display:none">设置</button>
  </span>
</header>
<div id="wrap">
  <nav id="toc" aria-label="文档目录"></nav>
  <div id="split" title="拖动调整目录宽度"></div>
  <main><div class="md" id="content"><p class="empty">正在加载…</p></div></main>
</div>

<div id="settings">
  <h3>设置</h3>
  <label class="row"><input type="checkbox" id="opt-keep"><span>关闭窗口后保持后台待命</span></label>
  <p class="desc">开启后关闭查看窗口时程序驻留后台（通知区图标，右键可退出），再次打开 .md 文件无需等待启动。默认关闭：关窗即退出，不占后台。仅影响独立窗口，不常驻也不会变慢。</p>
  <div class="ok-line"><button class="btn" id="settings-done" type="button">完成</button></div>
</div>

<script type="text/plain" id="__md__">__B64__</script>
<script>
/*__MARKED__*/
</script>
<script>
(function(){
  'use strict';
  var keepRunning = __KEEP_RUNNING__;

  function $(id){ return document.getElementById(id); }

  /* ---------- render markdown ---------- */
  try {
    var b = $('__md__').textContent;
    var bin = atob(b);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var md = new TextDecoder('utf-8').decode(bytes);
    $('content').innerHTML = marked.parse(md);
    $('meta').textContent = '__META__';
    /* 宽表格自己横向滚（右栏/手机窄栏）：套一层 .md-tablewrap，表格按内容宽
       伸展、最小满宽——不套的话表格被压缩到读不了，或者把整页撑出横向滚动 */
    Array.prototype.forEach.call($('content').querySelectorAll('table'), function(t){
      var w = document.createElement('div');
      w.className = 'md-tablewrap';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
  } catch(e) {
    $('content').innerHTML = '<p class="empty">解析失败：' + e.message + '</p>';
  }

  /* ---------- table of contents ---------- */
  var toc = $('toc'), btnToc = $('btn-toc'), mainEl = document.querySelector('main');
  var heads = [];
  try { heads = buildToc(); } catch(e) { heads = []; }

  function buildToc(){
    var hs = $('content').querySelectorAll('h1,h2,h3,h4,h5,h6');
    if (!hs.length) return [];
    var min = 6;
    hs.forEach(function(h){ var l = +h.tagName.charAt(1); if (l < min) min = l; });
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title';
    title.textContent = '目录 · ' + hs.length + ' 个标题';
    frag.appendChild(title);
    hs.forEach(function(h, i){
      var id = 'mdv-h-' + i;
      h.id = id;
      var a = document.createElement('a');
      a.className = 'ti';
      a.href = '#' + id;
      var text = (h.textContent || '').trim();
      a.textContent = text;
      a.title = text;
      a.style.setProperty('--ind', (+h.tagName.charAt(1) - min));
      frag.appendChild(a);
    });
    toc.appendChild(frag);
    return Array.prototype.slice.call(hs);
  }

  function setToc(on){
    document.body.classList.toggle('toc-off', !on);
    btnToc.classList.toggle('on', on);
    try { localStorage.setItem('mdv-toc-open', on ? '1' : '0'); } catch(e){}
  }

  if (heads.length){
    var saved = null;
    try { saved = localStorage.getItem('mdv-toc-open'); } catch(e){}
    setToc(saved !== '0');
    btnToc.style.display = '';
    btnToc.onclick = function(){ setToc(document.body.classList.contains('toc-off')); };
  } else {
    setToc(false);
    btnToc.style.display = 'none';
  }

  /* click -> immediate highlight + smooth scroll + flash.
     spyHold keeps the scrollspy from fighting the smooth scroll: while it is
     set the clicked entry stays highlighted; scrollend (Chromium/WebView2) or
     a 1s fallback re-arms the spy. */
  var spyHold = 0;
  function headingTop(h){
    /* heading's y inside main's scrollable content, independent of any
       offsetParent; the header sits outside main, so it never covers headings */
    return h.getBoundingClientRect().top - mainEl.getBoundingClientRect().top + mainEl.scrollTop;
  }
  toc.addEventListener('click', function(ev){
    var a = ev.target.closest ? ev.target.closest('a.ti') : null;
    if (!a) return;
    ev.preventDefault();
    var h = document.getElementById(a.getAttribute('href').slice(1));
    if (!h) return;
    for (var i = 0; i < items.length; i++) items[i].el.classList.toggle('cur', items[i].h === h);
    spyHold = Date.now();
    h.scrollIntoView({behavior:'smooth', block:'start'});
    h.classList.remove('flash');
    void h.offsetWidth;
    h.classList.add('flash');
  });
  mainEl.addEventListener('scrollend', function(){ spyHold = 0; });

  /* scrollspy: highlight current heading */
  var items = function(){
    var out = [];
    heads.forEach(function(h, i){
      var el = toc.querySelector('a[href="#mdv-h-' + i + '"]');
      if (el) out.push({h: h, el: el});
    });
    return out;
  }();
  var ticking = false;
  function spy(){
    ticking = false;
    if (!items.length || document.body.classList.contains('toc-off')) return;
    if (spyHold){ if (Date.now() - spyHold < 1000) return; spyHold = 0; }
    var top = mainEl.scrollTop, best = -1;
    /* pin to the last heading when main cannot scroll any further, so the
       highlight matches a click on a trailing TOC entry */
    var atBottom = top + mainEl.clientHeight >= mainEl.scrollHeight - 2;
    for (var i = 0; i < items.length; i++){
      // heading position inside the scroll container, with a small lead
      if (headingTop(items[i].h) - 80 <= top + 1) best = i; else break;
    }
    if (best < 0) best = 0;
    if (atBottom) best = items.length - 1;
    for (var j = 0; j < items.length; j++){
      items[j].el.classList.toggle('cur', j === best);
    }
    var cur = items[best].el;
    var tocTop = toc.scrollTop, tocH = toc.clientHeight;
    var y = cur.offsetTop;
    if (y < tocTop + 30 || y > tocTop + tocH - 30){
      toc.scrollTop = y - tocH / 2;
    }
  }
  mainEl.addEventListener('scroll', function(){
    if (!ticking){ ticking = true; requestAnimationFrame(spy); }
  });
  spy();

  /* ---------- drag to resize toc width ---------- */
  var split = $('split');
  split.addEventListener('mousedown', function(ev){
    ev.preventDefault();
    split.classList.add('drag');
    var startX = ev.clientX;
    var startW = toc.getBoundingClientRect().width;
    function move(e){
      var w = Math.min(420, Math.max(160, startW + e.clientX - startX));
      document.documentElement.style.setProperty('--toc-w', w + 'px');
      try { localStorage.setItem('mdv-toc-w', String(w)); } catch(err){}
    }
    function up(){
      split.classList.remove('drag');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
  try {
    var w = parseInt(localStorage.getItem('mdv-toc-w'), 10);
    if (w >= 160 && w <= 420) document.documentElement.style.setProperty('--toc-w', w + 'px');
  } catch(e){}

  /* ---------- settings ---------- */
  var host = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;
  var btnSettings = $('btn-settings'), panel = $('settings'), optKeep = $('opt-keep');
  if (host){
    btnSettings.style.display = '';
    optKeep.checked = !!keepRunning;
    btnSettings.onclick = function(){ panel.classList.toggle('open'); };
    $('settings-done').onclick = function(){ panel.classList.remove('open'); };
    panel.addEventListener('click', function(ev){ if (ev.target === panel) panel.classList.remove('open'); });
    optKeep.onchange = function(){
      keepRunning = optKeep.checked;
      try { host.postMessage(keepRunning ? 'keep:on' : 'keep:off'); } catch(e){}
    };
  }
})();
</script>
</body>
</html>
